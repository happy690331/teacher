<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153b31">
<title>注音符號聽力挑戰｜黑板教室</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
:root{--chalk:#f4f1df;--mint:#bde7ce;--yellow:#ffe596;--pink:#ffc5bf;--board:#174437;--board2:#10372e;--wood:#9b633b}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--chalk);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:linear-gradient(180deg,#d8e5dc 0 20%,#f3eee2 20% 100%);padding:clamp(12px,3vw,32px)}button,input{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto}.room{background:#eee5d4;border:10px solid var(--wood);border-radius:18px;padding:clamp(14px,3vw,34px);box-shadow:0 12px 0 #754628,0 22px 45px #20372c32;position:relative}.room:before{content:'';position:absolute;top:-34px;left:14%;width:72%;height:18px;border-radius:12px;background:#ffe8a0;box-shadow:0 0 25px #ffda75}.board{background-color:var(--board);background-image:radial-gradient(#ffffff0a 1px,transparent 1px);background-size:7px 7px;border:9px solid #75472d;border-radius:9px;box-shadow:inset 0 0 24px #001b15;padding:clamp(22px,4vw,44px);min-height:540px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.qr-card{position:absolute;right:clamp(22px,4vw,44px);top:clamp(22px,4vw,44px);width:128px;padding:9px;background:#f5f1df;border-radius:12px;color:#294338;text-align:center;font-size:11px;font-weight:800;box-shadow:0 3px 0 #9b8655}.qr-card img{width:100%;display:block;border-radius:4px}.qr-card span{display:block;margin-top:4px}.top-right{display:flex;justify-content:flex-end}.top-button{border:1px solid #ffffff70;background:#ffffff10;color:#f3f1df;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800}.top-button:hover{background:#ffffff25}.setup .heading{margin-right:145px}.brand{font-size:13px;font-weight:900;letter-spacing:.13em;color:var(--mint)}.tag{border:1px solid #ffffff4a;border-radius:99px;padding:6px 12px;font-size:13px;color:#dfecdf}.heading{text-align:center;margin:18px 0 26px}.heading h1{font-size:clamp(30px,5vw,54px);line-height:1.1;margin:0 0 10px;color:#fff7db;letter-spacing:.05em}.heading p{margin:0;color:#c6decf;font-size:15px}.chalk-line{border:0;border-top:2px dashed #ffffff55;margin:25px 0}.section-title{color:var(--yellow);font-size:16px;font-weight:900;margin:0 0 10px}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.option{min-height:56px;border:1px solid #ffffff38;border-radius:12px;color:#eff4e9;background:#ffffff0b;font-weight:700;transition:.15s}.option:hover,.option.selected{background:#dff0dc;color:#173c30;box-shadow:0 4px 0 #8bac9b;transform:translateY(-2px)}.option.selected:after{content:' ✓';font-weight:900}.row{margin:18px 0}.hint{font-size:12px;color:#bcd4c7;margin:8px 0 0}.actions{display:flex;justify-content:center;gap:12px;margin-top:25px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:13px;padding:14px 28px;font-weight:900;font-size:17px}.primary{background:var(--yellow);color:#263b2e;box-shadow:0 5px 0 #c99b43}.primary:hover{transform:translateY(-2px)}.secondary{background:transparent;color:var(--chalk);border:1px solid #ffffff55}.game{display:none}.game.active{display:block}.setup.hidden{display:none}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#ffffff0d;border:1px solid #ffffff30;border-radius:12px;text-align:center;padding:10px}.stat span{display:block;color:#bad9c6;font-size:12px}.stat strong{font-size:24px;color:#fff0bd}.timer-low{color:#ffb6a8!important}.prompt{text-align:center;padding:18px 0 4px}.listen{border:2px solid #ffe596;border-radius:50%;width:74px;height:74px;background:#ffe596;color:#243c31;font-size:30px;box-shadow:0 0 0 8px #ffe59621;transition:.15s}.listen:hover{transform:scale(1.06)}.prompt h2{margin:15px 0 6px;font-size:clamp(21px,4vw,32px)}.prompt p{color:#c4decf;margin:0}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:14px;margin:24px auto;max-width:960px}.player-question{border:1px solid #ffffff45;border-radius:14px;padding:14px;background:#ffffff08}.player-question h3{text-align:center;margin:0 0 10px;color:#fff0bd;font-size:17px}.player-question .choices{grid-template-columns:repeat(2,1fr);gap:9px;margin:0}.player-question.done{border-color:#bde7ce;background:#bde7ce18}.player-question.done h3:after{content:"　✓ 已答對";color:#bde7ce;font-size:13px}.choice{display:flex;align-items:center;justify-content:center;min-height:82px;background:#eef4e7;border:0;border-radius:15px;color:#214235;font-size:clamp(28px,5vw,42px);font-weight:900;box-shadow:0 5px 0 #a8bba6;transition:.15s}.vertical-answer{position:relative;display:flex;flex-direction:column;align-items:center;line-height:.92;padding:7px 10px;font-size:clamp(25px,4vw,36px)}.vertical-tone{position:absolute;top:3px;right:-1px;transform:translateX(55%);font-size:.58em;line-height:1}.choice:hover{transform:translateY(-3px)}.choice:disabled{opacity:.7;cursor:default}.feedback{height:28px;text-align:center;color:var(--yellow);font-weight:900}.scoreboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.player-score{border:1px solid #ffffff40;border-radius:12px;text-align:center;padding:13px;background:#ffffff0c}.player-score.current{outline:2px solid var(--yellow)}.player-score span{display:block;color:#c5decf;font-size:13px}.player-score strong{font-size:30px;color:#fff0bd}.end{text-align:center}.end .trophy{font-size:54px}.end h2{font-size:34px;margin:6px}.winner{color:var(--yellow);font-weight:900;font-size:20px}.note{font-size:12px;color:#b9d1c3;text-align:center;margin-top:20px}.hidden{display:none!important}@media(max-width:600px){.board{min-height:auto;padding:19px}.options{grid-template-columns:repeat(2,1fr)}.choices{grid-template-columns:repeat(2,1fr)}.scoreboard{grid-template-columns:repeat(2,1fr)}.heading{margin:20px 0}.room{border-width:7px}.top{align-items:flex-start}.brand{font-size:11px}}
</style></head>
<body><main class="app"><section class="room"><div class="board">
<div class="top"><div class="brand">✦ 黑板教室・聽力練習 ✦</div><div id="setupQR" class="qr-card"><img alt="注音符號聽力挑戰 QR Code"><span>掃描開啟遊戲</span></div><div id="gameTop" class="top-right hidden"><button id="returnSetup" class="top-button">↶ 回到遊戲設置</button></div></div>
<header class="heading"><h1>注音符號聽力挑戰</h1><p>豎起小耳朵，聽清楚再選答案！</p></header>
<section id="setup" class="setup">
 <div class="row"><h3 class="section-title">① 今天要聽什麼？</h3><div class="options" data-group="kind"><button class="option selected" data-value="single">單一注音</button><button class="option" data-value="double">雙拼注音</button><button class="option" data-value="triple">三拼注音</button></div><p class="hint">單一注音聽聲符或韻符；拼音會聽完整音節。</p></div>
 <div class="row"><h3 class="section-title">② 聲調挑戰</h3><div class="options" data-group="tones"><button class="option selected" data-value="all">五種聲調</button><button class="option" data-value="plain">不含聲調</button></div><p class="hint">五種聲調：第一聲、第二聲、第三聲、第四聲、輕聲。</p></div>
 <div class="row"><h3 class="section-title">③ 幾位同學一起玩？</h3><div class="options" data-group="players"><button class="option selected" data-value="1">1 人練習</button><button class="option" data-value="2">2 人比賽</button><button class="option" data-value="3">3 人比賽</button><button class="option" data-value="4">4 人比賽</button></div><p class="hint">兩位以上輪流作答，比一比誰答得又快又準！</p></div>
 <div class="row"><h3 class="section-title">④ 遊戲時間</h3><div class="options" data-group="seconds"><button class="option" data-value="20">20 秒</button><button class="option selected" data-value="30">30 秒</button><button class="option" data-value="40">40 秒</button><button class="option" data-value="50">50 秒</button></div></div>
 <div class="actions"><button id="start" class="primary">開始聽力挑戰　➜</button></div>
</section>
<section id="game" class="game"><div class="hud"><div class="stat"><span>⏱ 剩餘時間</span><strong id="timer">30</strong></div><div class="stat"><span>✦ 已答題數</span><strong id="answered">0</strong></div><div class="stat"><span>目前作答</span><strong id="turn">同學 1</strong></div></div>
<div id="scoreboard" class="scoreboard"></div><hr class="chalk-line"><div class="prompt"><button id="replay" class="listen" aria-label="再聽一次">🔊</button><h2>請聽發音，點選正確的注音！</h2><p>每位同學都有自己的選項；大家都答對，才能一起進到下一題。</p></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button id="quit" class="secondary">結束並看分數</button></div></section>
<section id="result" class="game end"><div class="trophy">🏆</div><h2>時間到！</h2><p>你們的聽力真棒！</p><div id="finalScores" class="scoreboard"></div><p id="winner" class="winner"></p><div class="actions"><button id="again" class="primary">再玩一次</button><button id="back" class="secondary">回設定</button></div></section>
<p class="note">聽力小提醒：注音幫助我們把國語的聲音拼讀出來。慢慢聽、仔細選，你一定做得到！</p>
</div></section></main>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s), state={kind:'single',tones:'all',players:1,seconds:30,scores:[],turn:0,answered:0,remaining:30,target:null,locked:false,timer:null};const pageURL='https://happy690331.github.io/teacher/%E6%B3%A8%E9%9F%B3%E7%AC%A6%E8%99%9F%E8%81%BD%E5%8A%9B%E6%8C%91%E6%88%B0.html';$('#setupQR img').src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=5&data='+encodeURIComponent(pageURL);
document.querySelectorAll('.options').forEach(group=>group.addEventListener('click',e=>{const b=e.target.closest('.option');if(!b)return;group.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b));state[group.dataset.group]=group.dataset.group==='players'?Number(b.dataset.value):group.dataset.group==='seconds'?Number(b.dataset.value):b.dataset.value}));
const initials=[...'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'];const medials=['','ㄧ','ㄨ','ㄩ'];const finals=['ㄚ','ㄛ','ㄜ','ㄝ','ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄧ','ㄨ','ㄩ','ㄦ'];const tones=['','ˊ','ˇ','ˋ','˙'],toneNames=['第一聲','第二聲','第三聲','第四聲','輕聲'];
function makeSyllables(){const set=new Set();initials.forEach(i=>medials.forEach(m=>finals.forEach(f=>{if(m&&((m==='ㄧ'&&['ㄧ','ㄨ','ㄩ'].includes(f))||(m==='ㄨ'&&['ㄧ','ㄨ','ㄩ'].includes(f))||(m==='ㄩ'&&['ㄧ','ㄨ','ㄩ'].includes(f))))return;set.add(i+m+f)})));return [...set]}
const syllables=makeSyllables();
function pick(){let base, tone=state.tones==='all'?Math.floor(Math.random()*5):0;if(state.kind==='single')base=[...initials,...finals][Math.floor(Math.random()*(initials.length+finals.length))];else{const eligible=syllables.filter(s=>state.kind==='double'?[...s].length===2:[...s].length===3);base=eligible[Math.floor(Math.random()*eligible.length)]}return{base,tone,display:base+tones[tone],toneName:toneNames[tone]}}
function optionsFor(t){let pool;if(state.tones==='all'){return [...tones].sort(()=>Math.random()-.5).map(x=>t.base+x)}if(state.kind==='single')pool=[...initials,...finals];else pool=syllables.filter(s=>s!==t.base);let opts=[t.base];while(opts.length<4){let x=pool[Math.floor(Math.random()*pool.length)];if(!opts.includes(x))opts.push(x)}return opts.sort(()=>Math.random()-.5)}
function choiceLabel(value){if(state.kind==='single')return value;const chars=[...value], marks=chars.filter(c=>tones.includes(c)), symbols=chars.filter(c=>!tones.includes(c));return `<span class="vertical-answer">${marks.length?`<span class="vertical-tone">${marks[0]}</span>`:''}${symbols.map(c=>`<span>${c}</span>`).join('')}</span>`}
function speak(t){if(!('speechSynthesis'in window)){ $('#feedback').textContent='這個瀏覽器暫時沒有語音功能，請使用最新版 Chrome 或 Edge。';return}speechSynthesis.cancel();const text=state.kind==='single'?t.base+'。':t.base+(t.tone===4?'輕聲':'');const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.78;u.pitch=1.1;speechSynthesis.speak(u)}
function renderScores(el){el.innerHTML=state.scores.map((v,i)=>`<div class="player-score"><span>${state.players===1?'我的分數':'同學 '+(i+1)}</span><strong>${v}</strong></div>`).join('')}
function next(){if(state.remaining<=0)return;state.target=pick();state.locked=false;state.answeredThisRound=Array(state.players).fill(false);$('#feedback').textContent='';$('#answered').textContent=state.answered;$('#turn').textContent=state.players===1?'練習中':'全員作答';renderScores($('#scoreboard'));$('#choices').innerHTML=Array.from({length:state.players},(_,i)=>`<section class="player-question" data-player="${i}"><h3>${state.players===1?'請選答案':'同學 '+(i+1)+' 的選項'}</h3><div class="choices">${optionsFor(state.target).map(x=>`<button class="choice" data-answer="${x}">${choiceLabel(x)}</button>`).join('')}</div></section>`).join('');$('#choices').querySelectorAll('.player-question').forEach(panel=>panel.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(Number(panel.dataset.player),b)));speak(state.target)}
function answer(player,b){if(state.locked||state.remaining<=0||state.answeredThisRound[player])return;const panel=b.closest('.player-question');if(b.dataset.answer===state.target.display||b.dataset.answer===state.target.base){state.answeredThisRound[player]=true;state.scores[player]++;panel.classList.add('done');panel.querySelectorAll('button').forEach(x=>x.disabled=true);renderScores($('#scoreboard'));const allDone=state.answeredThisRound.every(Boolean);$('#feedback').textContent=allDone?'大家都答對了！準備下一題 ✨':`同學 ${player+1} 答對了！等其他同學完成這題。`;if(allDone){state.locked=true;state.answered++;$('#answered').textContent=state.answered;setTimeout(next,700)}}else{$('#feedback').textContent=`同學 ${player+1} 再聽一次，試試看喔！`;b.disabled=true}}
function finish(){clearInterval(state.timer);if('speechSynthesis'in window)speechSynthesis.cancel();$('#game').classList.remove('active');$('#result').classList.add('active');renderScores($('#finalScores'));const max=Math.max(...state.scores), winners=state.scores.map((x,i)=>x===max?i:-1).filter(i=>i>=0);$('#winner').textContent=state.players===1?`你答對了 ${max} 題，繼續保持！`:winners.length===state.players?'平手！大家都很棒！':`恭喜同學 ${winners.map(x=>x+1).join('、')} 獲勝！`}
function start(){state.scores=Array(state.players).fill(0);state.turn=0;state.answered=0;state.remaining=state.seconds;$('#setup').classList.add('hidden');$('#setupQR').classList.add('hidden');$('#gameTop').classList.remove('hidden');$('#result').classList.remove('active');$('#game').classList.add('active');$('#timer').textContent=state.remaining;$('#timer').classList.remove('timer-low');next();state.timer=setInterval(()=>{state.remaining--;$('#timer').textContent=state.remaining;if(state.remaining<=5)$('#timer').classList.add('timer-low');if(state.remaining<=0)finish()},1000)}
$('#start').onclick=start;$('#replay').onclick=()=>state.target&&speak(state.target);$('#quit').onclick=finish;$('#again').onclick=start;$('#back').onclick=returnSetup;$('#returnSetup').onclick=returnSetup;function returnSetup(){clearInterval(state.timer);if('speechSynthesis'in window)speechSynthesis.cancel();$('#game').classList.remove('active');$('#result').classList.remove('active');$('#setup').classList.remove('hidden');$('#setupQR').classList.remove('hidden');$('#gameTop').classList.add('hidden')}
})();
</script></body></html>
