<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">注音符號聽力挑戰</title>
  <desc id="desc">教室黑板上寫著注音符號聽力挑戰，旁邊有耳朵和音符圖案。</desc>
  <defs>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#d7eadf" opacity=".12"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#09251d" flood-opacity=".55"/></filter>
  </defs>
  <rect width="800" height="500" fill="#eee5d4"/>
  <rect x="22" y="22" width="756" height="436" rx="20" fill="#9b633b"/>
  <rect x="37" y="37" width="726" height="406" rx="12" fill="#174437"/>
  <rect x="37" y="37" width="726" height="406" rx="12" fill="url(#grain)"/>
  <path d="M100 407h600" stroke="#d6b17b" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <text x="400" y="103" text-anchor="middle" fill="#bde7ce" font-family="sans-serif" font-size="24" font-weight="700" letter-spacing="5">黑板教室・聽力練習</text>
  <text x="400" y="176" text-anchor="middle" fill="#fff7db" font-family="sans-serif" font-size="48" font-weight="900">注音符號聽力挑戰</text>
  <g filter="url(#shadow)">
    <rect x="204" y="220" width="392" height="142" rx="20" fill="#f4f1df"/>
    <text x="295" y="318" text-anchor="middle" fill="#214235" font-family="sans-serif" font-size="70" font-weight="900">ㄅ</text>
    <text x="400" y="318" text-anchor="middle" fill="#214235" font-family="sans-serif" font-size="70" font-weight="900">ㄚ</text>
    <text x="510" y="318" text-anchor="middle" fill="#c99b43" font-family="sans-serif" font-size="68" font-weight="900">🔊</text>
  </g>
  <g fill="#ffe596" font-family="sans-serif" font-weight="800" font-size="21">
    <text x="400" y="390" text-anchor="middle">聽一聽　・　選一選　・　拿高分</text>
  </g>
  <circle cx="104" cy="117" r="8" fill="#ffc5bf"/><circle cx="696" cy="117" r="8" fill="#ffc5bf"/>
</svg>
