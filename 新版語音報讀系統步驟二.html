<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 考卷朗讀輔助系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js core and worker -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- QR code generator for the current page URL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            overflow: hidden; /* 隱藏整體滾動，由各區域獨立滾動 */
        }

        /* 頁面切換邏輯 (使用 data-mode 控制顯示與隱藏) */
        body[data-mode="page1"] #view-page1 { display: flex; }
        body[data-mode="page1"] #view-pdf-container { display: none; }
        body[data-mode="page1"] #toolbar-page2 { display: none; }

        body[data-mode="page2"] #view-page1 { display: none; }
        body[data-mode="page2"] #view-pdf-container { display: block; }
        body[data-mode="page2"] #toolbar-page2 { display: flex; }

        #page1-qrcode-card {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 60;
            width: 132px;
            padding: 10px;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
            text-align: center;
        }
        #page1-qrcode { display: flex; justify-content: center; }
        #page1-qrcode img, #page1-qrcode canvas { max-width: 100%; height: auto; }
        body[data-mode="page2"] #page1-qrcode-card { display: none; }
        @media (max-width: 640px) {
            #page1-qrcode-card { top: 8px; right: 8px; width: 92px; padding: 6px; }
            #page1-qrcode img, #page1-qrcode canvas { width: 76px !important; height: 76px !important; }
            #page1-qrcode-card p { font-size: 10px; line-height: 1.25; }
        }

        /* PDF 顯示區域樣式 */
        #view-pdf-container {
            height: calc(100vh - 64px); /* 扣除頂部 toolbar 高度 */
            overflow-y: auto;
            padding: 20px;
            background-color: #e5e7eb;
        }

        .pdf-page {
            position: relative;
            margin: 0 auto 30px auto;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .pdf-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 文字層：保留以利於動態擷取文字 */
        .textLayer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            opacity: 0; 
            line-height: 1.0;
        }
        .textLayer > span {
            color: transparent;
            position: absolute;
            white-space: pre;
            transform-origin: 0% 0%;
        }

        /* 互動層：放置紅框 */
        .interaction-layer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            pointer-events: none; /* 穿透點擊 */
            z-index: 10;
        }

        /* 互動紅框共用樣式 (報讀模式) */
        .question-box {
            position: absolute;
            pointer-events: auto;
            border-radius: 4px;
            box-sizing: border-box;
            cursor: pointer;
            /* 預設完全隱藏紅框，連滑鼠經過也不顯示，讓考卷看起來完全像原貌 */
            background-color: transparent; 
            border: 3px solid transparent; 
            transition: all 0.2s;
        }
        
        /* 點擊後的紅框樣式 (報讀中) */
        .question-box.active-read {
            background-color: rgba(239, 68, 68, 0.1) !important; /* 淡紅色背景 */
            border: 3px solid #ef4444 !important; /* 紅色邊框，這時候才唯一顯示出紅框 */
            z-index: 20;
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body data-mode="page1" class="text-gray-800">

    <aside id="page1-qrcode-card" aria-label="本網頁 QR code">
        <p class="mb-2 text-xs font-bold text-blue-800">平板掃描開啟</p>
        <div id="page1-qrcode" role="img" aria-label="掃描即可開啟本網頁"></div>
        <p class="mt-2 text-[10px] text-gray-500">考卷朗讀輔助系統</p>
    </aside>

    <!-- ==================== PAGE 1: 上傳與開始辨識 ==================== -->
    <div id="view-page1" class="h-screen w-full flex-col items-center justify-start bg-white p-4 overflow-y-auto">
        <!-- 調整寬度以容納三個區塊 -->
        <div class="max-w-5xl w-full text-center space-y-6">
            <div>
                <h1 class="text-3xl font-bold text-blue-700 mb-2">PDF 考卷朗讀輔助系統</h1>
                <p class="text-gray-500">請選擇載入考卷的方式並點擊開始辨識</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 方式一：本機上傳 -->
                <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 hover:shadow-md transition flex flex-col items-center justify-center">
                    <h2 class="text-lg font-bold text-gray-700 mb-4 text-center">方式一：本機上傳</h2>
                    <label for="pdf-upload" class="cursor-pointer flex flex-col items-center gap-3 w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <span id="file-name-display" class="text-md font-medium text-gray-700">選擇 PDF 檔案</span>
                        <input type="file" id="pdf-upload" accept="application/pdf" class="hidden">
                    </label>
                </div>

                <!-- 方式二：GitHub 題庫 -->
                <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 hover:shadow-md transition flex flex-col items-center justify-center">
                    <h2 class="text-lg font-bold text-gray-700 mb-4 text-center">方式二：從線上題庫載入</h2>
                    <div class="w-full flex flex-col items-center justify-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <select id="github-pdf-select" class="w-full max-w-[250px] p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm text-gray-700 cursor-pointer">
                            <option value="">載入題庫中...</option>
                        </select>
                        <!-- 來源提示已隱藏 -->
                    </div>
                </div>

                <!-- 方式三：從本機上傳至 GitHub 題庫 -->
                <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 hover:shadow-md transition flex flex-col items-center justify-center">
                    <h2 class="text-lg font-bold text-gray-700 mb-4 text-center">方式三：上傳至 GitHub 題庫</h2>
                    <div class="w-full flex flex-col items-center justify-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                        </svg>
                        <input type="file" id="github-upload-pdf" accept="application/pdf,.pdf" class="w-full text-sm text-gray-700">
                        <input type="password" id="github-upload-password" autocomplete="current-password" placeholder="上傳密碼" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm text-gray-700">
                        <button id="github-upload-btn" type="button" class="w-full px-3 py-2 bg-green-600 text-white rounded-md text-sm font-bold hover:bg-green-700 transition">上傳到 exam paper2</button>
                        <span id="github-upload-status" class="text-xs text-gray-600 text-center" role="status" aria-live="polite">只會上傳 PDF 至指定資料夾</span>
                    </div>
                </div>
            </div>

            <button id="start-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg text-xl transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                開始辨識與報讀
            </button>
        </div>
    </div>

    <!-- ==================== 頂部 Toolbar: PAGE 2 (報讀模式) ==================== -->
    <div id="toolbar-page2" class="h-16 bg-white shadow-md w-full items-center px-6 justify-between shrink-0">
        <div class="flex items-center gap-4">
            <button id="back-to-p1-btn" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-md font-medium transition">
                🔙 回到主選單
            </button>
            <span class="font-bold text-lg text-blue-800 hidden md:block">語音報讀模式</span>
            <span class="text-sm text-gray-500">點擊畫面上的紅框範圍即可朗讀</span>
        </div>
        <div class="flex items-center gap-2 md:gap-4">
            <!-- 語音切換 -->
            <div class="flex items-center gap-2 mr-2">
                <span class="text-sm font-bold text-gray-700 hidden md:block">人聲:</span>
                <select id="voice-select" class="w-28 p-1 border border-gray-300 rounded text-sm text-gray-700 outline-none cursor-pointer">
                    <option value="">載入語音中...</option>
                </select>
            </div>

            <!-- 速度調整 (預設為 0.7) -->
            <div class="flex items-center gap-2 mr-2">
                <span class="text-sm font-bold text-gray-700">語速: <span id="rate-display">0.7</span>x</span>
                <input type="range" id="rate-slider" min="0.5" max="2.0" step="0.1" value="0.7" class="w-24">
            </div>
            
            <!-- 播放控制 -->
            <button id="pause-btn" class="px-4 py-2 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold rounded-md shadow transition disabled:opacity-50" disabled>
                暫停/繼續
            </button>
            <button id="cancel-read-btn" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white font-bold rounded-md shadow transition disabled:opacity-50" disabled>
                取消報讀
            </button>
        </div>
    </div>

    <!-- ==================== PDF 渲染容器 (Page 2) ==================== -->
    <div id="view-pdf-container">
        <!-- Loading 狀態 -->
        <div id="loading-indicator" class="hidden flex-col items-center justify-center h-full text-blue-600">
            <svg class="animate-spin h-12 w-12 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-xl font-bold">正在掃描紅框標記並還原考卷原貌...</p>
        </div>
        
        <!-- PDF 頁面注入區 -->
        <div id="pdf-pages-wrapper" class="flex flex-col items-center"></div>
    </div>

    <script>
        // 以目前公開頁面的完整網址產生 QR code，掃描後可直接開啟本頁。
        if (window.QRCode) {
            new QRCode(document.getElementById('page1-qrcode'), {
                text: window.location.href,
                width: 112,
                height: 112,
                colorDark: '#111827',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        // PDF.js 設置
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const CMAP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/';
        const CMAP_PACKED = true;

        // 全域變數
        let pdfSource = null; 
        let pdfDocument = null;
        const synth = window.speechSynthesis;
        let availableVoices = []; 
        let isReading = false;
        let isPaused = false;
        let activeBox = null;
        let textChunks = [];    
        let chunkIndex = 0;     
        let chunkTimeout = null;

        // DOM 元素
        const body = document.body;
        const fileInput = document.getElementById('pdf-upload');
        const fileNameDisplay = document.getElementById('file-name-display');
        const githubPdfSelect = document.getElementById('github-pdf-select');
        const githubUploadFileInput = document.getElementById('github-upload-pdf');
        const githubUploadPasswordInput = document.getElementById('github-upload-password');
        const githubUploadBtn = document.getElementById('github-upload-btn');
        const githubUploadStatus = document.getElementById('github-upload-status');
        // 建立並部署上傳 Worker 後，將此值換成 Worker 的 https://...workers.dev 網址。
        const GITHUB_UPLOAD_WORKER_URL = 'https://exam-paper2-upload-happy690331.happy690331.workers.dev';
        const startBtn = document.getElementById('start-btn');
        const pdfPagesWrapper = document.getElementById('pdf-pages-wrapper');
        const loadingIndicator = document.getElementById('loading-indicator');
        
        const voiceSelect = document.getElementById('voice-select'); 
        const rateSlider = document.getElementById('rate-slider');
        const rateDisplay = document.getElementById('rate-display');
        const pauseBtn = document.getElementById('pause-btn');
        const cancelReadBtn = document.getElementById('cancel-read-btn');

        // 載入 GitHub 題庫清單
        async function loadGitHubPdfs() {
            try {
                const response = await fetch('https://api.github.com/repos/happy690331/teacher/contents/exam%20paper2');
                if (!response.ok) throw new Error('無法讀取題庫');
                const data = await response.json();
                
                githubPdfSelect.innerHTML = '<option value="">-- 請選擇線上考卷 --</option>';
                data.forEach(item => {
                    if (item.name.endsWith('.pdf')) {
                        const option = document.createElement('option');
                        option.value = item.download_url;
                        option.textContent = item.name;
                        githubPdfSelect.appendChild(option);
                    }
                });
            } catch (error) {
                console.error('GitHub 題庫載入失敗:', error);
                githubPdfSelect.innerHTML = '<option value="">載入失敗，請確認網路或 API 限制</option>';
            }
        }

        loadGitHubPdfs();

        githubUploadBtn.addEventListener('click', async () => {
            const file = githubUploadFileInput.files[0];
            const password = githubUploadPasswordInput.value;
            if (!file || !file.name.toLowerCase().endsWith('.pdf')) {
                githubUploadStatus.textContent = '請先選擇 PDF 檔案。';
                return;
            }
            if (!password) {
                githubUploadStatus.textContent = '請輸入上傳密碼。';
                githubUploadPasswordInput.focus();
                return;
            }
            if (GITHUB_UPLOAD_WORKER_URL.includes('YOUR-WORKER-NAME')) {
                githubUploadStatus.textContent = '上傳服務尚未設定完成，請先完成 Worker 設定。';
                return;
            }

            githubUploadBtn.disabled = true;
            githubUploadStatus.textContent = '正在安全上傳，請稍候……';
            try {
                const response = await fetch(`${GITHUB_UPLOAD_WORKER_URL}/upload?filename=${encodeURIComponent(file.name)}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${password}`,
                        'Content-Type': 'application/pdf'
                    },
                    body: file
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.error || `上傳失敗（${response.status}）`);

                githubUploadPasswordInput.value = '';
                githubUploadStatus.textContent = `上傳完成：${result.path}。已加入方式二題庫清單。`;
                await loadGitHubPdfs();
                const uploadedOption = Array.from(githubPdfSelect.options).find(option => option.textContent === file.name);
                if (uploadedOption) {
                    githubPdfSelect.value = uploadedOption.value;
                    githubPdfSelect.dispatchEvent(new Event('change'));
                }
            } catch (error) {
                githubUploadStatus.textContent = error.message || '上傳失敗，請確認網路或密碼。';
            } finally {
                githubUploadBtn.disabled = false;
            }
        });

        // 事件綁定
        document.getElementById('back-to-p1-btn').addEventListener('click', () => {
            stopSpeaking(true);
            switchMode('page1');
        });

        // 監聽本機檔案選擇
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                pdfSource = { type: 'local', file: file };
                fileNameDisplay.textContent = file.name;
                fileNameDisplay.classList.add('text-blue-600');
                
                // 清除其他方式的選擇
                githubPdfSelect.value = "";
                startBtn.disabled = false;
            } else {
                alert('請上傳有效的 PDF 檔案。');
                startBtn.disabled = true;
            }
        });

        // 監聽線上題庫選擇
        githubPdfSelect.addEventListener('change', function(e) {
            const url = e.target.value;
            if (url) {
                const fileName = e.target.options[e.target.selectedIndex].text;
                pdfSource = { type: 'url', url: url, name: fileName };
                
                // 清除其他方式的選擇
                fileInput.value = "";
                fileNameDisplay.textContent = "選擇 PDF 檔案";
                fileNameDisplay.classList.remove('text-blue-600');
                startBtn.disabled = false;
            } else {
                if (!fileInput.files.length) {
                    startBtn.disabled = true;
                    pdfSource = null;
                }
            }
        });

        // 開始辨識
        startBtn.addEventListener('click', async () => {
            if (!pdfSource) return;
            switchMode('page2');
            pdfPagesWrapper.innerHTML = ''; 
            loadingIndicator.classList.remove('hidden');
            loadingIndicator.classList.add('flex');
            
            try {
                let arrayBuffer;
                
                if (pdfSource.type === 'local') {
                    arrayBuffer = await pdfSource.file.arrayBuffer();
                } else if (pdfSource.type === 'url') {
                    const loadText = loadingIndicator.querySelector('p');
                    const originalText = loadText.textContent;
                    loadText.textContent = `正在從線上下載：${pdfSource.name}...`;
                    
                    const response = await fetch(pdfSource.url);
                    if (!response.ok) throw new Error('線上考卷下載失敗');
                    arrayBuffer = await response.arrayBuffer();
                    
                    loadText.textContent = originalText;
                }

                pdfDocument = await pdfjsLib.getDocument({
                    data: arrayBuffer,
                    cMapUrl: CMAP_URL,
                    cMapPacked: CMAP_PACKED
                }).promise;

                for (let pageNum = 1; pageNum <= pdfDocument.numPages; pageNum++) {
                    await renderPage(pageNum);
                }
            } catch (error) {
                console.error("PDF 載入失敗:", error);
                alert("解析 PDF 時發生錯誤: " + error.message);
                switchMode('page1');
            } finally {
                loadingIndicator.classList.add('hidden');
                loadingIndicator.classList.remove('flex');
            }
        });

        function switchMode(mode) {
            body.dataset.mode = mode;
            stopSpeaking(true);
        }

        // 渲染單頁 PDF
        async function renderPage(pageNum) {
            const page = await pdfDocument.getPage(pageNum);
            const scale = 1.5; 
            const viewport = page.getViewport({ scale });

            const pageDiv = document.createElement('div');
            pageDiv.className = 'pdf-page';
            pageDiv.style.width = viewport.width + 'px';
            pageDiv.style.height = viewport.height + 'px';

            const canvas = document.createElement('canvas');
            canvas.className = 'pdf-canvas';
            const context = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            pageDiv.appendChild(canvas);
            await page.render({ canvasContext: context, viewport }).promise;

            const textLayerDiv = document.createElement('div');
            textLayerDiv.className = 'textLayer';
            pageDiv.appendChild(textLayerDiv);
            const textContent = await page.getTextContent();
            await pdfjsLib.renderTextLayer({
                textContent, container: textLayerDiv, viewport, textDivs: []
            }).promise;

            const interactionLayer = document.createElement('div');
            interactionLayer.className = 'interaction-layer';
            pageDiv.appendChild(interactionLayer);

            pdfPagesWrapper.appendChild(pageDiv);

            detectRedBoxesFromCanvas(canvas, interactionLayer);
        }

        function detectRedBoxesFromCanvas(canvas, interactionLayer) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;

            const redPixels = new Uint8Array(width * height);
            for (let i = 0; i < width * height; i++) {
                const idx = i * 4;
                const r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];

                if (a > 30 && r > 130 && g < r * 0.7 && b < r * 0.7) {
                    redPixels[i] = 1;
                    data[idx] = 255;   
                    data[idx+1] = 255; 
                    data[idx+2] = 255; 
                    data[idx+3] = 255; 
                }
            }
            
            ctx.putImageData(imgData, 0, 0);

            const boxes = [];
            const q = new Int32Array(width * height);
            
            for (let i = 0; i < width * height; i++) {
                if (redPixels[i] === 1) {
                    let left = width, right = 0, top = height, bottom = 0;
                    let head = 0, tail = 0;
                    
                    q[tail++] = i;
                    redPixels[i] = 2; 
                    
                    while (head < tail) {
                        let curr = q[head++];
                        let cy = Math.floor(curr / width);
                        let cx = curr % width;
                        
                        if (cx < left) left = cx;
                        if (cx > right) right = cx;
                        if (cy < top) top = cy;
                        if (cy > bottom) bottom = cy;
                        
                        for (let dy = -2; dy <= 2; dy++) {
                            for (let dx = -2; dx <= 2; dx++) {
                                if (dx === 0 && dy === 0) continue;
                                let nx = cx + dx;
                                let ny = cy + dy;
                                
                                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                    let ni = ny * width + nx;
                                    if (redPixels[ni] === 1) {
                                        redPixels[ni] = 2; 
                                        q[tail++] = ni;
                                    }
                                }
                            }
                        }
                    }
                    
                    if ((right - left) > 15 && (bottom - top) > 15) {
                        boxes.push({left, right, top, bottom});
                    }
                }
            }

            if (boxes.length > 0) {
                boxes.forEach(b => {
                    createBoxElement(interactionLayer, b.left, b.top, b.right - b.left, b.bottom - b.top);
                });
            }
        }

        function createBoxElement(layer, left, top, width, height) {
            const box = document.createElement('div');
            box.className = 'question-box';
            box.style.left = left + 'px';
            box.style.top = top + 'px';
            box.style.width = width + 'px';
            box.style.height = height + 'px';

            box.addEventListener('click', (e) => {
                e.stopPropagation();
                const pageDiv = box.closest('.pdf-page');
                const textLayer = pageDiv.querySelector('.textLayer');
                const textToRead = extractTextFromBoxCoords(box, textLayer);
                
                if (textToRead.trim()) {
                    speakText(textToRead, box);
                } else {
                    const originalBg = box.style.backgroundColor;
                    box.style.backgroundColor = "rgba(239, 68, 68, 0.4)";
                    setTimeout(() => box.style.backgroundColor = originalBg, 300);
                }
            });

            layer.appendChild(box);
            return box;
        }

        function extractTextFromBoxCoords(box, textLayer) {
            const boxRect = box.getBoundingClientRect();
            const spans = Array.from(textLayer.querySelectorAll('span'));
            
            const insideSpans = spans.filter(span => {
                const spanRect = span.getBoundingClientRect();
                
                const spanCenterX = spanRect.left + (spanRect.width / 2);
                const spanCenterY = spanRect.top + (spanRect.height / 2);

                return spanCenterX >= boxRect.left && spanCenterX <= boxRect.right &&
                       spanCenterY >= boxRect.top && spanCenterY <= boxRect.bottom;
            });

            const items = insideSpans.map(span => ({
                text: span.textContent,
                rect: span.getBoundingClientRect()
            }));

            // PDF.js 有時會把帶分數的整數、分子、分母拆成三個文字區塊。
            // 依版面位置重組成「2 1/3」，後續才能轉成「二又三分之一」。
            const used = new Set();
            const reconstructed = [];
            for (let i = 0; i < items.length; i++) {
                if (used.has(i) || !/^\d+$/.test(items[i].text.trim())) continue;
                const numerator = items[i];
                const numeratorRect = numerator.rect;
                const numeratorCenterX = numeratorRect.left + numeratorRect.width / 2;
                const numeratorCenterY = numeratorRect.top + numeratorRect.height / 2;
                let best = null;

                for (let j = 0; j < items.length; j++) {
                    if (j === i || used.has(j) || !/^\d+$/.test(items[j].text.trim())) continue;
                    const denominator = items[j];
                    const denominatorRect = denominator.rect;
                    const denominatorCenterX = denominatorRect.left + denominatorRect.width / 2;
                    const denominatorCenterY = denominatorRect.top + denominatorRect.height / 2;
                    const averageHeight = (numeratorRect.height + denominatorRect.height) / 2;
                    const verticalDistance = denominatorCenterY - numeratorCenterY;
                    const horizontalDistance = Math.abs(denominatorCenterX - numeratorCenterX);

                    if (verticalDistance < averageHeight * 0.55 || verticalDistance > averageHeight * 2.1) continue;
                    if (horizontalDistance > Math.max(4, averageHeight * 0.55)) continue;

                    const midpointY = (numeratorCenterY + denominatorCenterY) / 2;
                    const wholeCandidates = items
                        .map((item, index) => ({ item, index }))
                        .filter(({ item, index }) => {
                            if (index === i || index === j || used.has(index) || !/^\d+$/.test(item.text.trim())) return false;
                            const rect = item.rect;
                            const centerY = rect.top + rect.height / 2;
                            const gap = numeratorRect.left - rect.right;
                            return Math.abs(centerY - midpointY) <= averageHeight * 0.45 &&
                                   gap >= -averageHeight * 0.2 && gap <= averageHeight * 1.4;
                        })
                        .sort((a, b) => (numeratorRect.left - a.item.rect.right) - (numeratorRect.left - b.item.rect.right));

                    // 帶分數必須同時找到左側整數，避免把上下排列的題號誤認成分數。
                    if (!wholeCandidates.length) continue;
                    const score = horizontalDistance + Math.abs(verticalDistance - averageHeight * 1.2);
                    if (!best || score < best.score) {
                        best = { denominator, denominatorIndex: j, whole: wholeCandidates[0].item, wholeIndex: wholeCandidates[0].index, score };
                    }
                }

                if (best) {
                    const rect = {
                        left: best.whole.rect.left,
                        right: best.denominator.rect.right,
                        top: Math.min(numeratorRect.top, best.whole.rect.top),
                        bottom: Math.max(best.denominator.rect.bottom, best.whole.rect.bottom),
                        get width() { return this.right - this.left; },
                        get height() { return this.bottom - this.top; }
                    };
                    reconstructed.push({
                        text: `${best.whole.text.trim()} ${numerator.text.trim()}/${best.denominator.text.trim()}`,
                        rect
                    });
                    used.add(i);
                    used.add(best.denominatorIndex);
                    used.add(best.wholeIndex);
                }
            }

            const orderedItems = items.filter((_, index) => !used.has(index)).concat(reconstructed);
            orderedItems.sort((a, b) => {
                const rectA = a.rect;
                const rectB = b.rect;
                
                if (Math.abs(rectA.top - rectB.top) > Math.min(rectA.height, rectB.height) / 2) {
                    return rectA.top - rectB.top;
                }
                return rectA.left - rectB.left;
            });

            return orderedItems.map(item => item.text).join('');
        }

        function integerToChinese(value) {
            const digits = '零一二三四五六七八九';
            const source = String(value).replace(/^0+(?=\d)/, '');
            if (!source || /^0+$/.test(source)) return '零';
            if (source.length > 16) return source.split('').map(digit => digits[Number(digit)]).join('');

            const sectionUnits = ['', '十', '百', '千'];
            const largeUnits = ['', '萬', '億', '兆'];
            const sections = [];
            for (let end = source.length; end > 0; end -= 4) {
                sections.push(source.slice(Math.max(0, end - 4), end));
            }

            const convertSection = (section, omitLeadingOne) => {
                let result = '';
                let pendingZero = false;
                const padded = section.padStart(4, '0');
                for (let index = 0; index < 4; index++) {
                    const digit = Number(padded[index]);
                    if (digit === 0) {
                        if (result && /[1-9]/.test(padded.slice(index + 1))) pendingZero = true;
                        continue;
                    }
                    if (pendingZero) result += '零';
                    pendingZero = false;
                    if (index === 2 && digit === 1 && !result && omitLeadingOne) result += '十';
                    else result += digits[digit] + sectionUnits[3 - index];
                }
                return result;
            };

            let result = '';
            let needsZero = false;
            for (let index = sections.length - 1; index >= 0; index--) {
                const section = Number(sections[index]);
                if (section === 0) {
                    if (result) needsZero = true;
                    continue;
                }
                if (result && (needsZero || section < 1000) && !result.endsWith('零')) result += '零';
                result += convertSection(String(section), !result) + largeUnits[index];
                needsZero = false;
            }
            return result;
        }

        function normalizeMathForSpeech(text) {
            const fractionParts = {
                '½': [1, 2], '⅓': [1, 3], '⅔': [2, 3], '¼': [1, 4], '¾': [3, 4],
                '⅕': [1, 5], '⅖': [2, 5], '⅗': [3, 5], '⅘': [4, 5], '⅙': [1, 6],
                '⅚': [5, 6], '⅛': [1, 8], '⅜': [3, 8], '⅝': [5, 8], '⅞': [7, 8]
            };
            const spokenFraction = (numerator, denominator) => `${integerToChinese(denominator)}分之${integerToChinese(numerator)}`;

            let result = text
                // Unicode 分數，例如 2⅓、½。
                .replace(/(\d+)\s*([½⅓⅔¼¾⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞])/g, (_, whole, fraction) => {
                    const [numerator, denominator] = fractionParts[fraction];
                    return `${integerToChinese(whole)}又${spokenFraction(numerator, denominator)}`;
                })
                .replace(/([½⅓⅔¼¾⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞])/g, fraction => {
                    const [numerator, denominator] = fractionParts[fraction];
                    return spokenFraction(numerator, denominator);
                })
                // 帶分數先於一般分數處理，例如 2 1/3。
                .replace(/(\d+)\s*(?:又|\s+)(\d+)\s*[\/⁄]\s*(\d+)/g, (_, whole, numerator, denominator) =>
                    `${integerToChinese(whole)}又${spokenFraction(numerator, denominator.trim())}`)
                .replace(/(\d+)\s*[\/⁄](\s*\d+)/g, (_, numerator, denominator) =>
                    spokenFraction(numerator, denominator.trim()))
                // 小數點改成「點」，小數位逐字念，例如 3.14 -> 三點一四。
                .replace(/(\d+)\.(\d+)/g, (_, whole, decimal) =>
                    `${integerToChinese(whole)}點${decimal.split('').map(digit => '零一二三四五六七八九'[Number(digit)]).join('')}`);
            return result;
        }

        rateSlider.addEventListener('input', function() {
            rateDisplay.textContent = this.value;
        });

        function stopSpeaking(clearHighlight = true) {
            synth.cancel();
            clearTimeout(chunkTimeout); 
            isReading = false;
            isPaused = false;
            updateBtnStates();
            if (clearHighlight) {
                clearHighlights();
            }
        }

        function clearHighlights() {
            document.querySelectorAll('.question-box').forEach(b => b.classList.remove('active-read'));
            activeBox = null;
        }

        function speakText(text, boxElement) {
            if (activeBox === boxElement && isReading && !isPaused) return;

            stopSpeaking(false); 

            document.querySelectorAll('.question-box').forEach(b => b.classList.remove('active-read'));
            activeBox = boxElement;
            activeBox.classList.add('active-read');
            
            // 【核心修正】：改用不含符號的 @@ 作為標記，保護英文字母與括號轉換
            const cleanText = normalizeMathForSpeech(text)
                // 獨立的 v 或 V 唸打勾
                .replace(/ˇ|\b[Vv]\b/g, "打勾")
                // 【新增】：遇到 (A)、（B）等括號包住的英文字母，轉為「選項A」並停頓
                .replace(/[(（]([a-zA-Z\uFF21-\uFF3A\uFF41-\uFF5A])[)）]/g, "選項$1@@500@@")
                // 擴增圓圈數字的支援範圍，轉為「選項一」並停頓
                .replace(/||||①|②|③|④|○1|○2|○3|○4|➀|➁|➂|➃|❶|❷|❸|❹/g, match => {
                    const map = {
                        '':'選項一','':'選項二','':'選項三','':'選項四', 
                        '①':'選項一','②':'選項二','③':'選項三','④':'選項四',
                        '○1':'選項一','○2':'選項二','○3':'選項三','○4':'選項四',
                        '➀':'選項一','➁':'選項二','➂':'選項三','➃':'選項四',
                        '❶':'選項一','❷':'選項二','❸':'選項三','❹':'選項四'
                    };
                    return map[match] + "@@500@@";
                })
                // 將所有中英文標點符號一律消除不念，替換為安全停頓標記 @@500@@
                .replace(/[.,:;?!()[\]{}"'<>~^\-/_=\\|，。、：；？！（）「」『』《》〈〉【】〔〕－——…]+/g, "@@500@@")
                // 確保所有英文字母 (含全形) 保留，並在後面加上停頓
                .replace(/([a-zA-Z\uFF21-\uFF3A\uFF41-\uFF5A]+)/g, "$1@@500@@")
                // 原本的 □ 停頓 1 秒
                .replace(/□+/g, "@@1000@@")
                // 防呆機制：合併連續的停頓，避免停太久
                .replace(/(@@500@@)+/g, "@@500@@");

            // 改良式分段：利用 @@ 進行精準分割，完全不會吃掉字母
            const parts = cleanText.split(/(@@\d+@@)/);
            
            textChunks = parts.filter(p => p.trim() !== ''); 
            chunkIndex = 0;
            isReading = true;
            isPaused = false;
            updateBtnStates();

            playNextChunk();
        }

        function playNextChunk() {
            if (!isReading || isPaused) return;

            if (chunkIndex >= textChunks.length) {
                isReading = false;
                updateBtnStates();
                return;
            }

            const chunk = textChunks[chunkIndex].trim();
            if (!chunk) {
                chunkIndex++;
                playNextChunk();
                return;
            }

            // 檢查這一段是否為我們剛剛插入的停頓標記
            const pauseMatch = chunk.match(/^@@(\d+)@@$/);
            if (pauseMatch) {
                const delay = parseInt(pauseMatch[1], 10);
                chunkIndex++;
                chunkTimeout = setTimeout(playNextChunk, delay);
                return;
            }

            const utterance = new SpeechSynthesisUtterance(chunk);
            utterance.lang = 'zh-TW';
            utterance.rate = parseFloat(rateSlider.value);
            
            const selectedVoiceName = voiceSelect.value;
            const selectedVoice = availableVoices.find(v => v.name === selectedVoiceName);
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            } else {
                const twVoice = synth.getVoices().find(v => v.lang.toLowerCase().includes('zh'));
                if (twVoice) utterance.voice = twVoice;
            }

            utterance.onstart = () => { isReading = true; isPaused = false; updateBtnStates(); };
            
            utterance.onend = () => { 
                if (!isReading) return;
                chunkIndex++;
                playNextChunk();
            }; 
            
            utterance.onerror = () => { 
                if (!isReading) return;
                chunkIndex++;
                playNextChunk();
            }; 

            synth.speak(utterance);
        }

        pauseBtn.addEventListener('click', () => {
            if (isReading) {
                if (isPaused) {
                    isPaused = false;
                    if (!synth.speaking && !synth.pending) {
                        playNextChunk();
                    } else {
                        synth.resume();
                    }
                } else {
                    isPaused = true;
                    synth.pause();
                    clearTimeout(chunkTimeout); 
                }
                updateBtnStates();
            }
        });

        cancelReadBtn.addEventListener('click', () => stopSpeaking(true));

        function updateBtnStates() {
            if (isReading || isPaused) {
                pauseBtn.disabled = false;
                cancelReadBtn.disabled = false;
            } else {
                pauseBtn.disabled = true;
                cancelReadBtn.disabled = true;
            }
        }

        function populateVoices() {
            let voices = synth.getVoices();
            availableVoices = voices.filter(v => v.lang.toLowerCase().includes('zh'));
            
            if (availableVoices.length === 0) {
                availableVoices = voices;
            }

            voiceSelect.innerHTML = '';
            if (availableVoices.length === 0) {
                const option = document.createElement('option');
                option.textContent = '無可用語音';
                voiceSelect.appendChild(option);
                return;
            }

            availableVoices.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = voice.name.replace('Microsoft ', '').replace('Google ', '').replace('Online (Natural) - ', '');
                voiceSelect.appendChild(option);
            });
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }
        populateVoices();
    </script>
</body>
</html>
