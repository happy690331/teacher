<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 考卷朗讀輔助系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js core and worker -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            overflow: hidden; /* 隱藏整體滾動，由各區域獨立滾動 */
        }

        /* 頁面切換邏輯 (使用 data-mode 控制顯示與隱藏) */
        body[data-mode="page1"] #view-page1 { display: flex; }
        body[data-mode="page1"] #view-pdf-container { display: none; }
        body[data-mode="page1"] #toolbar-page2 { display: none; }

        body[data-mode="page2"] #view-page1 { display: none; }
        body[data-mode="page2"] #view-pdf-container { display: block; }
        body[data-mode="page2"] #toolbar-page2 { display: flex; }

        /* PDF 顯示區域樣式 */
        #view-pdf-container {
            height: calc(100vh - 64px); /* 扣除頂部 toolbar 高度 */
            overflow-y: auto;
            padding: 20px;
            background-color: #e5e7eb;
        }

        .pdf-page {
            position: relative;
            margin: 0 auto 30px auto;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .pdf-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 文字層：保留以利於動態擷取文字 */
        .textLayer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            opacity: 0; 
            line-height: 1.0;
        }
        .textLayer > span {
            color: transparent;
            position: absolute;
            white-space: pre;
            transform-origin: 0% 0%;
        }

        /* 互動層：放置紅框 */
        .interaction-layer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            pointer-events: none; /* 穿透點擊 */
            z-index: 10;
        }

        /* 互動紅框共用樣式 (報讀模式) */
        .question-box {
            position: absolute;
            pointer-events: auto;
            border-radius: 4px;
            box-sizing: border-box;
            cursor: pointer;
            /* 預設完全隱藏紅框，連滑鼠經過也不顯示，讓考卷看起來完全像原貌 */
            background-color: transparent; 
            border: 3px solid transparent; 
            transition: all 0.2s;
        }
        
        /* 點擊後的紅框樣式 (報讀中) */
        .question-box.active-read {
            background-color: rgba(239, 68, 68, 0.1) !important; /* 淡紅色背景 */
            border: 3px solid #ef4444 !important; /* 紅色邊框，這時候才唯一顯示出紅框 */
            z-index: 20;
        }

        /* ==================== 【新增：手動報讀框】 ==================== */
        /* 用途：處理考卷上沒有被紅框標記到的文字，手動框選後報讀 */
        #manual-reader-frame {
            position: fixed;
            display: none;
            box-sizing: border-box;
            z-index: 40;
            border: 3px dashed #4f46e5;
            background-color: rgba(79, 70, 229, 0.07);
            border-radius: 6px;
            pointer-events: none; /* 框內透明可穿透，仍可點擊下方原有紅框 */
        }
        body[data-mode="page2"].manual-mode #manual-reader-frame { display: block; }

        /* 報讀中：整個框轉為綠色 */
        #manual-reader-frame.active-read {
            border-color: #16a34a;
            background-color: rgba(22, 163, 74, 0.12);
        }
        #manual-reader-frame.active-read .mrf-handle { background: #16a34a; }
        #manual-reader-frame.active-read .mrf-label { background: #16a34a; }

        /* 框上方標籤 */
        .mrf-label {
            position: absolute;
            top: -27px; left: 50%;
            transform: translateX(-50%);
            background: #4f46e5; color: #fff;
            font-size: 12px; font-weight: bold;
            padding: 3px 10px; border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            box-shadow: 0 2px 4px rgba(0,0,0,.25);
        }

        /* 四邊 = 拖曳移動區 */
        .mrf-edge { position: absolute; pointer-events: auto; cursor: move; touch-action: none; }
        .mrf-edge-top    { top: -3px;    left: -3px;  right: -3px;  height: 14px; }
        .mrf-edge-bottom { bottom: -3px; left: -3px;  right: -3px;  height: 14px; }
        .mrf-edge-left   { left: -3px;   top: -3px;   bottom: -3px; width: 14px; }
        .mrf-edge-right  { right: -3px;  top: -3px;   bottom: -3px; width: 14px; }

        /* 四角 = 縮放把手 */
        .mrf-handle {
            position: absolute;
            width: 18px; height: 18px;
            background: #4f46e5;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            box-shadow: 0 1px 4px rgba(0,0,0,.4);
        }
        .mrf-nw { top: -10px;    left: -10px;  cursor: nwse-resize; }
        .mrf-ne { top: -10px;    right: -10px; cursor: nesw-resize; }
        .mrf-sw { bottom: -10px; left: -10px;  cursor: nesw-resize; }
        .mrf-se { bottom: -10px; right: -10px; cursor: nwse-resize; }

        /* 控制面板 */
        #manual-reader-panel {
            position: fixed;
            display: none;
            right: 16px; bottom: 16px;
            width: 310px;
            z-index: 50;
            background: #fff;
            border: 2px solid #4f46e5;
            border-radius: 10px;
            box-shadow: 0 10px 28px rgba(0,0,0,.22);
            overflow: hidden;
        }
        body[data-mode="page2"].manual-mode #manual-reader-panel { display: block; }

        #mrp-head {
            background: #4f46e5; color: #fff;
            padding: 8px 12px;
            font-weight: bold; font-size: 14px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: move; user-select: none; touch-action: none;
        }
        #mrf-close-btn {
            background: rgba(255,255,255,.2); color: #fff;
            width: 24px; height: 24px; line-height: 1;
            border-radius: 4px; font-weight: bold;
            cursor: pointer; transition: background .2s;
        }
        #mrf-close-btn:hover { background: rgba(255,255,255,.4); }

        #mrp-body { padding: 10px 12px 12px 12px; }

        #mrf-preview {
            height: 80px; overflow-y: auto;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 13px; line-height: 1.6; color: #334155;
            white-space: pre-wrap; word-break: break-all;
        }
        #mrf-preview.mrf-empty { color: #94a3b8; font-style: italic; }

        /* Toolbar 上的開關按鈕：開啟時變色 */
        #manual-mode-btn.mrf-btn-on {
            background-color: #4338ca;
            box-shadow: 0 0 0 3px rgba(79,70,229,.35);
        }

        /* ==================== 【新增：跳過底線答案】 ==================== */
        /* 偵測到的「填答底線上的答案」標示，只在功能開啟時顯示，
           目的是讓老師一眼看出哪些字會被跳過，避免靜默漏字。 */
        .answer-blank-mark {
            position: absolute;
            pointer-events: none;
            background-color: rgba(251, 191, 36, 0.38);
            border-bottom: 2px solid #f59e0b;
            border-radius: 2px;
            display: none;
            z-index: 15;
        }
        body.skip-answer-mode .answer-blank-mark { display: block; }

        /* Toolbar 開關按鈕：開啟時變色 */
        #skip-answer-btn.skip-btn-on {
            background-color: #b45309;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, .35);
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body data-mode="page1" class="text-gray-800">

    <!-- ==================== PAGE 1: 上傳與開始辨識 ==================== -->
    <div id="view-page1" class="h-screen w-full flex-col items-center justify-center bg-white p-4">
        <!-- 調整寬度以容納三個區塊 -->
        <div class="max-w-5xl w-full text-center space-y-6">
            <div>
                <h1 class="text-3xl font-bold text-blue-700 mb-2">PDF 考卷朗讀輔助系統</h1>
                <p class="text-gray-500">請選擇載入考卷的方式並點擊開始辨識</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 方式一：本機上傳 -->
                <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 hover:shadow-md transition flex flex-col items-center justify-center">
                    <h2 class="text-lg font-bold text-gray-700 mb-4 text-center">方式一：本機上傳</h2>
                    <label for="pdf-upload" class="cursor-pointer flex flex-col items-center gap-3 w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <span id="file-name-display" class="text-md font-medium text-gray-700">選擇 PDF 檔案</span>
                        <input type="file" id="pdf-upload" accept="application/pdf" class="hidden">
                    </label>
                </div>

                <!-- 方式二：GitHub 題庫 -->
                <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 hover:shadow-md transition flex flex-col items-center justify-center">
                    <h2 class="text-lg font-bold text-gray-700 mb-4 text-center">方式二：從線上題庫載入</h2>
                    <div class="w-full flex flex-col items-center justify-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <select id="github-pdf-select" class="w-full max-w-[250px] p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm text-gray-700 cursor-pointer">
                            <option value="">載入題庫中...</option>
                        </select>
                    </div>
                </div>

                <!-- 方式三：雲端硬碟 (密碼框+下拉選單) -->
                <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 hover:shadow-md transition flex flex-col items-center justify-center">
                    <h2 class="text-lg font-bold text-gray-700 mb-4 text-center">方式三：從雲端硬碟載入</h2>
                    <div class="w-full flex flex-col items-center justify-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                        </svg>
                        <div class="w-full flex gap-2">
                            <input type="password" id="gdrive-api-key" placeholder="請貼上 API 金鑰" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm text-gray-700">
                            <button id="load-gdrive-btn" class="px-3 py-2 bg-green-500 text-white rounded-md text-sm font-bold hover:bg-green-600 shrink-0 transition">載入</button>
                        </div>
                        <select id="gdrive-pdf-select" class="w-full max-w-[250px] p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm text-gray-700 cursor-pointer disabled:bg-gray-100 disabled:cursor-not-allowed" disabled>
                            <option value="">請先輸入上方金鑰並載入</option>
                        </select>
                        <span class="text-xs text-gray-500 text-center">雲端資料夾：1u5VANt...</span>
                    </div>
                </div>
            </div>

            <button id="start-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg text-xl transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                開始辨識與報讀
            </button>
        </div>
    </div>

    <!-- ==================== 頂部 Toolbar: PAGE 2 (報讀模式) ==================== -->
    <div id="toolbar-page2" class="h-16 bg-white shadow-md w-full items-center px-6 justify-between shrink-0">
        <div class="flex items-center gap-4">
            <button id="back-to-p1-btn" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-md font-medium transition">
                🔙 回到主選單
            </button>
            <span class="font-bold text-lg text-blue-800 hidden md:block">語音報讀模式</span>
            <span class="text-sm text-gray-500 hidden xl:block">點擊畫面上的紅框範圍即可朗讀</span>
        </div>
        <div class="flex items-center gap-2 md:gap-4">
            <!-- 排版切換 (支援直書/橫書) -->
            <div class="flex items-center gap-1 md:gap-2 mr-1">
                <span class="text-sm font-bold text-gray-700 hidden lg:block">排版:</span>
                <select id="reading-direction" class="w-24 p-1 border border-gray-300 rounded text-sm text-gray-700 outline-none cursor-pointer">
                    <option value="horizontal">橫排(左至右)</option>
                    <option value="vertical">直排(右至左)</option>
                </select>
            </div>

            <!-- 語音切換 -->
            <div class="flex items-center gap-1 md:gap-2 mr-1">
                <span class="text-sm font-bold text-gray-700 hidden lg:block">人聲:</span>
                <select id="voice-select" class="w-28 p-1 border border-gray-300 rounded text-sm text-gray-700 outline-none cursor-pointer">
                    <option value="">載入語音中...</option>
                </select>
            </div>

            <!-- 速度調整 (預設為 0.7) -->
            <div class="flex items-center gap-1 md:gap-2 mr-1">
                <span class="text-sm font-bold text-gray-700 hidden lg:block">語速: <span id="rate-display">0.7</span>x</span>
                <input type="range" id="rate-slider" min="0.5" max="2.0" step="0.1" value="0.7" class="w-20">
            </div>
            
            <!-- 跳過底線答案開關 -->
            <button id="skip-answer-btn" class="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-md shadow transition" title="開啟後，印在填答底線上的答案不會被念出來（黃色標示處即為會跳過的文字）">
                &#128683; 跳過答案
            </button>

            <!-- 手動報讀框開關 -->
            <button id="manual-mode-btn" class="px-3 py-2 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-md shadow transition" title="開啟可移動、可縮放的手動報讀框，用來報讀沒有被紅框標到的文字">
                &#9995; 手動框
            </button>

            <!-- 播放控制 -->
            <button id="pause-btn" class="px-3 py-2 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold rounded-md shadow transition disabled:opacity-50" disabled>
                暫停
            </button>
            <button id="cancel-read-btn" class="px-3 py-2 bg-red-500 hover:bg-red-600 text-white font-bold rounded-md shadow transition disabled:opacity-50" disabled>
                取消報讀
            </button>
        </div>
    </div>

    <!-- ==================== PDF 渲染容器 (Page 2) ==================== -->
    <div id="view-pdf-container">
        <!-- Loading 狀態 -->
        <div id="loading-indicator" class="hidden flex-col items-center justify-center h-full text-blue-600">
            <svg class="animate-spin h-12 w-12 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-xl font-bold">正在掃描紅框標記並還原考卷原貌...</p>
        </div>
        
        <!-- PDF 頁面注入區 -->
        <div id="pdf-pages-wrapper" class="flex flex-col items-center"></div>
    </div>

    <!-- ==================== 【新增：手動報讀框】 ==================== -->
    <div id="manual-reader-frame">
        <span class="mrf-label">&#10021; 手動報讀框（拖曳邊框移動 / 拖曳四角改大小）</span>
        <div class="mrf-edge mrf-edge-top"></div>
        <div class="mrf-edge mrf-edge-bottom"></div>
        <div class="mrf-edge mrf-edge-left"></div>
        <div class="mrf-edge mrf-edge-right"></div>
        <div class="mrf-handle mrf-nw" data-dir="nw"></div>
        <div class="mrf-handle mrf-ne" data-dir="ne"></div>
        <div class="mrf-handle mrf-sw" data-dir="sw"></div>
        <div class="mrf-handle mrf-se" data-dir="se"></div>
    </div>

    <!-- 手動報讀框的控制面板 -->
    <div id="manual-reader-panel">
        <div id="mrp-head">
            <span>&#9995; 手動報讀框</span>
            <button id="mrf-close-btn" title="關閉手動框">&#10005;</button>
        </div>
        <div id="mrp-body">
            <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-bold text-gray-600">框內偵測到的文字</span>
                <span id="mrf-count" class="text-xs font-bold text-indigo-600">0 字</span>
            </div>
            <div id="mrf-preview" class="mrf-empty">把框移到要報讀的文字上面</div>
            <div class="flex gap-2 mt-2">
                <button id="mrf-speak-btn" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-md text-sm shadow transition disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                    &#128266; 朗讀框內文字
                </button>
                <button id="mrf-reset-btn" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-md text-sm transition" title="把框移回畫面中央">置中</button>
            </div>
            <p class="text-[11px] text-gray-400 mt-2 leading-snug">
                方向鍵微調位置 &middot; Shift+方向鍵改變大小 &middot; Enter 朗讀
            </p>
        </div>
    </div>

    <script>
        // PDF.js 設置
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const CMAP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/';
        const CMAP_PACKED = true;

        // ================= 設定區 =================
        const GDRIVE_FOLDER_ID = '1u5VANtBOPraiVsnKOvln9XME43UWtW-T'; // 您的雲端資料夾ID
        // ==========================================

        // 全域變數
        let pdfSource = null; 
        let pdfDocument = null;
        const synth = window.speechSynthesis;
        let availableVoices = []; 
        let isReading = false;
        let isPaused = false;
        let activeBox = null;
        let textChunks = [];    
        let chunkIndex = 0;     
        let chunkTimeout = null;
        let currentSessionId = 0; // 【核心修正】：給每次發音任務唯一的身份證，防止互相干擾

        // DOM 元素
        const body = document.body;
        const fileInput = document.getElementById('pdf-upload');
        const fileNameDisplay = document.getElementById('file-name-display');
        const githubPdfSelect = document.getElementById('github-pdf-select');
        const gdriveApiKeyInput = document.getElementById('gdrive-api-key'); 
        const loadGdriveBtn = document.getElementById('load-gdrive-btn'); 
        const gdrivePdfSelect = document.getElementById('gdrive-pdf-select'); 
        const startBtn = document.getElementById('start-btn');
        const pdfPagesWrapper = document.getElementById('pdf-pages-wrapper');
        const loadingIndicator = document.getElementById('loading-indicator');
        
        const voiceSelect = document.getElementById('voice-select'); 
        const rateSlider = document.getElementById('rate-slider');
        const rateDisplay = document.getElementById('rate-display');
        const pauseBtn = document.getElementById('pause-btn');
        const cancelReadBtn = document.getElementById('cancel-read-btn');

        // 載入 GitHub 題庫清單
        async function loadGitHubPdfs() {
            try {
                const response = await fetch('https://api.github.com/repos/happy690331/teacher/contents/exam%20paper2');
                if (!response.ok) throw new Error('無法讀取題庫');
                const data = await response.json();
                
                githubPdfSelect.innerHTML = '<option value="">-- 請選擇線上考卷 --</option>';
                data.forEach(item => {
                    if (item.name.endsWith('.pdf')) {
                        const option = document.createElement('option');
                        option.value = item.download_url;
                        option.textContent = item.name;
                        githubPdfSelect.appendChild(option);
                    }
                });
            } catch (error) {
                console.error('GitHub 題庫載入失敗:', error);
                githubPdfSelect.innerHTML = '<option value="">載入失敗，請確認網路或 API 限制</option>';
            }
        }

        // 載入 Google Drive 題庫清單
        async function loadGoogleDrivePdfs(apiKey) {
            if (!apiKey) {

        async function renderPage(pageNum) {

        function autoSetReadingDirection(textLayer, pageWidth, pageHeight) {
            const spans = Array.from(textLayer.querySelectorAll('span'));
            if (spans.length === 0) return;

            let isVertical = false;

            if (pageWidth > pageHeight) {
                let maxFontSize = 0;
                let titleCenterX = 0;

                spans.forEach(span => {
                    let fontSize = parseFloat(span.style.fontSize);
                    if (isNaN(fontSize)) fontSize = span.offsetHeight;
                    
                    if (fontSize > maxFontSize) {
                        maxFontSize = fontSize;
                        let left = parseFloat(span.style.left);
                        if (isNaN(left)) left = span.offsetLeft;
                        titleCenterX = left + (span.offsetWidth / 2);
                    }
                });

                if (titleCenterX > pageWidth * 0.75) {
                    isVertical = true;
                }
            }

            const directionSelect = document.getElementById('reading-direction');
            if (isVertical) {
                directionSelect.value = 'vertical';
                console.log("自動偵測：橫式考卷且大標題在右方，已切換為 直排(右至左)");
            } else {
                directionSelect.value = 'horizontal';
                console.log("自動偵測：維持預設 橫排(左至右)");
            }
        }

        function detectRedBoxesFromCanvas(canvas, interactionLayer) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;

            const redPixels = new Uint8Array(width * height);
            for (let i = 0; i < width * height; i++) {
                const idx = i * 4;
                const r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];

                if (a > 30 && r > 130 && g < r * 0.7 && b < r * 0.7) {
                    redPixels[i] = 1;
                    data[idx] = 255;   
                    data[idx+1] = 255; 
                    data[idx+2] = 255; 
                    data[idx+3] = 255; 
                }
            }
            
            ctx.putImageData(imgData, 0, 0);

            const boxes = [];
            const q = new Int32Array(width * height);
            
            for (let i = 0; i < width * height; i++) {
                if (redPixels[i] === 1) {
                    let left = width, right = 0, top = height, bottom = 0;
                    let head = 0, tail = 0;
                    
                    q[tail++] = i;
                    redPixels[i] = 2; 
                    
                    while (head < tail) {
                        let curr = q[head++];
                        let cy = Math.floor(curr / width);
                        let cx = curr % width;
                        
                        if (cx < left) left = cx;
                        if (cx > right) right = cx;
                        if (cy < top) top = cy;
                        if (cy > bottom) bottom = cy;
                        
                        for (let dy = -2; dy <= 2; dy++) {
                            for (let dx = -2; dx <= 2; dx++) {
                                if (dx === 0 && dy === 0) continue;
                                let nx = cx + dx;
                                let ny = cy + dy;
                                
                                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                    let ni = ny * width + nx;
                                    if (redPixels[ni] === 1) {
                                        redPixels[ni] = 2; 
                                        q[tail++] = ni;
                                    }
                                }
                            }
                        }
                    }
                    
                    if ((right - left) > 15 && (bottom - top) > 15) {
                        boxes.push({left, right, top, bottom});
                    }
                }
            }

            if (boxes.length > 0) {
                boxes.forEach(b => {
                    createBoxElement(interactionLayer, b.left, b.top, b.right - b.left, b.bottom - b.top);
                });
            }
        }

        function createBoxElement(layer, left, top, width, height) {
            const box = document.createElement('div');
            box.className = 'question-box';
            box.style.left = left + 'px';
            box.style.top = top + 'px';
            box.style.width = width + 'px';
            box.style.height = height + 'px';

            box.addEventListener('click', (e) => {
                e.stopPropagation();
                const pageDiv = box.closest('.pdf-page');
                const textLayer = pageDiv.querySelector('.textLayer');
                const textToRead = extractTextFromBoxCoords(box, textLayer);
                
                if (textToRead.trim()) {
                    speakText(textToRead, box);
                } else {
                    const originalBg = box.style.backgroundColor;
                    box.style.backgroundColor = "rgba(239, 68, 68, 0.4)";
                    setTimeout(() => box.style.backgroundColor = originalBg, 300);
                }
            });

            layer.appendChild(box);
            return box;
        }

        // ==================== 【核心修正：分行/分欄排序演算法】 ====================
        function extractTextFromBoxCoords(box, textLayer) {
            const boxRect = box.getBoundingClientRect();
            const spans = Array.from(textLayer.querySelectorAll('span'));
            
            const insideSpans = spans.filter(span => {
                const spanRect = span.getBoundingClientRect();
                
                // 【終極修正：只要沾到紅框邊就抓】確保不論排版如何都不會漏字
                const overlapW = Math.max(0, Math.min(spanRect.right, boxRect.right) - Math.max(spanRect.left, boxRect.left));
                const overlapH = Math.max(0, Math.min(spanRect.bottom, boxRect.bottom) - Math.max(spanRect.top, boxRect.top));

                return overlapW > 0 && overlapH > 0; // 改為大於 0，確保最敏銳的抓取
            }).filter(span => !(skipAnswerMode && span.dataset.answerBlank === '1')); // 【新增】跳過底線上的答案

            const direction = document.getElementById('reading-direction').value;
            let sortedSpans = [];

            if (direction === 'vertical') {
                // 【直式排版】：由右至左分欄，同欄由上而下
                let columns = [];
                insideSpans.forEach(span => {
                    const rect = span.getBoundingClientRect();
                    const centerX = rect.left + (rect.width / 2);
                    const centerY = rect.top + (rect.height / 2);
                    
                    let added = false;
                    for (let col of columns) {
                        const threshold = Math.max(10, Math.min(rect.width, col.width) * 0.6);
                        if (Math.abs(col.centerX - centerX) <= threshold) {
                            col.spans.push({span, rect, centerX, centerY});
                            added = true;
                            break;
                        }
                    }
                    if (!added) {
                        columns.push({ centerX, width: rect.width, spans: [{span, rect, centerX, centerY}] });
                    }
                });

                columns.sort((a, b) => b.centerX - a.centerX);
                columns.forEach(col => {
                    col.spans.sort((a, b) => a.centerY - b.centerY);
                    sortedSpans.push(...col.spans.map(s => s.span));
                });

            } else {
                // 【橫式排版】：由上至下分行，同行由左至右
                let lines = [];
                insideSpans.forEach(span => {
                    const rect = span.getBoundingClientRect();
                    const centerX = rect.left + (rect.width / 2);
                    const centerY = rect.top + (rect.height / 2);
                    
                    let added = false;
                    for (let line of lines) {
                        const threshold = Math.max(10, Math.min(rect.height, line.height) * 0.6);
                        if (Math.abs(line.centerY - centerY) <= threshold) {
                            line.spans.push({span, rect, centerX, centerY});
                            added = true;
                            break;
                        }
                    }
                    if (!added) {
                        lines.push({ centerY, height: rect.height, spans: [{span, rect, centerX, centerY}] });
                    }
                });

                lines.sort((a, b) => a.centerY - b.centerY);
                lines.forEach(line => {
                    line.spans.sort((a, b) => a.centerX - b.centerX);
                    sortedSpans.push(...line.spans.map(s => s.span));
                });
            }

            return sortedSpans.map(s => s.textContent).join('');
        }

        // 【核心修正：讓舊語音的殘留訊號徹底失效】
        function stopSpeaking(clearHighlight = true) {

        function speakText(text, boxElement) {
            if (activeBox === boxElement && isReading && !isPaused) return;

            stopSpeaking(false); 

            document.querySelectorAll('.question-box').forEach(b => b.classList.remove('active-read'));
            const mrfPrev = document.getElementById('manual-reader-frame');
            if (mrfPrev) mrfPrev.classList.remove('active-read'); // 一併清除手動框
            activeBox = boxElement;
            activeBox.classList.add('active-read');
            
            const cleanText = text
                .replace(/(\d)([.,:])(?=\d)/g, "$1{{$2}}")
                .replace(/ˇ|\b[Vv]\b/g, "打勾")
                .replace(/[(（]([a-zA-Z\uFF21-\uFF3A\uFF41-\uFF5A])[)）]/g, "選項$1@@500@@")
                .replace(/[(（]\s*[1１]\s*[)）]/g, "選項一@@500@@")
                .replace(/[(（]\s*[2２]\s*[)）]/g, "選項二@@500@@")
                .replace(/[(（]\s*[3３]\s*[)）]/g, "選項三@@500@@")
                .replace(/[(（]\s*[4４]\s*[)）]/g, "選項四@@500@@")
                .replace(/(?:○|〇|◯|⭕)\s*[1１]|①|➀|❶|/g, "選項一@@500@@")
                .replace(/(?:○|〇|◯|⭕)\s*[2２]|②|➁|❷|/g, "選項二@@500@@")
                .replace(/(?:○|〇|◯|⭕)\s*[3３]|③|➂|❸|/g, "選項三@@500@@")
                .replace(/(?:○|〇|◯|⭕)\s*[4４]|④|➃|❹|/g, "選項四@@500@@")
                .replace(/[.,:;?!()[\]{}"'~^_\\|，。、：；？！（）「」『』《》〈〉【】〔〕——…]+/g, "@@500@@")
                .replace(/\{\{([.,:])\}\}/g, "$1")
                .replace(/([a-zA-Z\uFF21-\uFF3A\uFF41-\uFF5A]+)/g, "$1@@500@@")
                .replace(/□+/g, "@@1000@@")
                .replace(/(@@500@@)+/g, "@@500@@");

            const parts = cleanText.split(/(@@\d+@@)/);
            
            textChunks = parts.filter(p => p.trim() !== ''); 
            chunkIndex = 0;
            isReading = true;
            isPaused = false;
            updateBtnStates();

            currentSessionId++; // 設定本次報讀的新身份證
            const sessionId = currentSessionId;
            
            // 【核心修正：50毫秒深呼吸】，確保 cancel() 已徹底清空舊狀態
            setTimeout(() => {
                if (sessionId === currentSessionId) {
                    playNextChunk(sessionId);
                }
            }, 50);
        }

        // 加入 sessionId 判斷，防禦殘留事件干擾
        function playNextChunk(sessionId) {
            if (sessionId !== currentSessionId) return; // 幽靈事件防護盾
            if (!isReading || isPaused) return;

            if (chunkIndex >= textChunks.length) {
                isReading = false;
                updateBtnStates();
                return;
            }

            const chunk = textChunks[chunkIndex].trim();
            if (!chunk) {
                chunkIndex++;
                playNextChunk(sessionId);
                return;
            }

            const pauseMatch = chunk.match(/^@@(\d+)@@$/);
            if (pauseMatch) {
                const delay = parseInt(pauseMatch[1], 10);
                chunkIndex++;
                chunkTimeout = setTimeout(() => playNextChunk(sessionId), delay);
                return;
            }

            const utterance = new SpeechSynthesisUtterance(chunk);
            utterance.lang = 'zh-TW';
            utterance.rate = parseFloat(rateSlider.value);
            
            const selectedVoiceName = voiceSelect.value;
            const selectedVoice = availableVoices.find(v => v.name === selectedVoiceName);
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            } else {
                const twVoice = synth.getVoices().find(v => v.lang.toLowerCase().includes('zh'));
                if (twVoice) utterance.voice = twVoice;
            }

            utterance.onstart = () => { 
                if (sessionId !== currentSessionId) return; // 幽靈事件防護盾
                isReading = true; 
                isPaused = false; 
                updateBtnStates(); 
            };
            
            utterance.onend = () => { 
                if (sessionId !== currentSessionId || !isReading) return; // 幽靈事件防護盾
                chunkIndex++;
                playNextChunk(sessionId);
            }; 
            
            utterance.onerror = () => { 
                if (sessionId !== currentSessionId || !isReading) return; // 幽靈事件防護盾
                chunkIndex++;
                playNextChunk(sessionId);
            }; 

            synth.speak(utterance);
        }

        pauseBtn.addEventListener('click', () => {
            if (isReading) {
                if (isPaused) {
                    isPaused = false;
                    if (!synth.speaking && !synth.pending) {

                    } else {

        // ==================================================================
        // ============ 【新增功能：跳過底線答案】 ===========================
        // 需求：數學考卷若是「已填答案版」，答案會印在填答底線上。報讀時
        //       不應念出答案，要直接跳過念下一個字。
        //
        // 為什麼只能用影像判斷：
        //   實測這些考卷，答案和題目數字在文字層裡完全一樣（例如
        //   「5000 和 172 合起來是 5172」，前兩個是題目、第三個是答案），
        //   單看文字內容無法分辨，只能靠「這段文字下方有沒有填答底線」。
        //
        // 安全設計：
        //   影像判斷不可能 100% 準確（實測約有 1/60 的題目文字會被誤判），
        //   所以 (1) 預設關閉，(2) 開啟時用黃色標出所有會被跳過的文字，
        //   讓老師一眼看出有沒有誤判，而不是靜默漏字。
        // ==================================================================
        let skipAnswerMode = false;
        const skipAnswerBtn = document.getElementById('skip-answer-btn');

        // 只有「純數字」的文字才會被當成答案跳過。
        // 這個條件是實測後加上的關鍵保護：有些考卷會用底線「強調」人名或
        // 關鍵詞（例如「丹丹和 4 位同學」、「請判斷下方算式的答案」），
        // 若只看底線就跳過，會把題意整句吞掉。實測空白數學考卷在加上這個
        // 條件後，受影響的題目從 10/29 降到 0/29，而答案卷的偵測率不變。
        const ANSWER_LIKE = /^[\s\d.,，、．・]+$/;

        // ---------- 掃描 canvas 找出水平細線（填答底線）----------
        // 回傳 canvas 像素座標的線段 {x1, x2, y, thick}
        function findUnderlineSegments(canvas, minLen, maxThick) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const W = canvas.width, H = canvas.height;
            const data = ctx.getImageData(0, 0, W, H).data;

            // 1. 建立「深色像素」地圖
            //    注意：紅框偵測已先把紅色像素塗白，所以這裡看到的是考卷原本的黑色內容
            const dark = new Uint8Array(W * H);
            for (let i = 0; i < W * H; i++) {
                const p = i * 4;
                if (data[p + 3] <= 30) continue;
                if (0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2] < 160) dark[i] = 1;
            }

            // 2. 逐列找出夠長的水平連續深色像素
            const runs = [];
            for (let y = 0; y < H; y++) {
                let x = 0;
                const base = y * W;
                while (x < W) {
                    if (!dark[base + x]) { x++; continue; }
                    let x2 = x;
                    while (x2 + 1 < W && dark[base + x2 + 1]) x2++;
                    if (x2 - x + 1 >= minLen) runs.push({ y, x1: x, x2: x2 });
                    x = x2 + 1;
                }
            }

            // 3. 垂直合併成線段，並剔除過厚的（那是色塊或文字筆畫，不是細線）
            runs.sort((a, b) => a.y - b.y || a.x1 - b.x1);
            const used = new Uint8Array(runs.length);
            const segs = [];
            for (let i = 0; i < runs.length; i++) {
                if (used[i]) continue;
                const group = [runs[i]];
                used[i] = 1;
                for (let j = i + 1; j < runs.length; j++) {
                    if (used[j]) continue;
                    if (runs[j].y - group[group.length - 1].y > 2) break;
                    const ov = Math.min(runs[j].x2, group[0].x2) - Math.max(runs[j].x1, group[0].x1);
                    if (ov > (group[0].x2 - group[0].x1) * 0.6) { group.push(runs[j]); used[j] = 1; }
                }
                const thick = group[group.length - 1].y - group[0].y + 1;
                if (thick <= maxThick) {
                    let a = group[0].x1, b = group[0].x2;
                    group.forEach(r => { if (r.x1 < a) a = r.x1; if (r.x2 > b) b = r.x2; });
                    segs.push({ x1: a, x2: b, y: group[0].y, thick: thick });
                }
            }
            return segs;
        }

        // ---------- 標記「坐在填答底線上」的文字 ----------
        function markAnswerBlanks(canvas, textLayer, interactionLayer) {
            try {
                const spans = Array.from(textLayer.querySelectorAll('span')).filter(s => s.textContent.trim());
                if (spans.length === 0) return;

                const cRect = canvas.getBoundingClientRect();
                if (!cRect.width || !cRect.height) return;
                const sx = canvas.width / cRect.width;
                const sy = canvas.height / cRect.height;

                // 以該頁「文字高度中位數」當基準，讓門檻隨字級自動調整，
                // 不必為不同考卷重新調參數。
                const heights = spans.map(s => s.getBoundingClientRect().height * sy)
                                     .filter(h => h > 0).sort((a, b) => a - b);
                if (heights.length === 0) return;
                const em = heights[Math.floor(heights.length / 2)];

                const minLen   = Math.max(20, em * 1.1);   // 線至少要比一個字寬一點
                const maxThick = Math.max(2, Math.round(em * 0.09)); // 必須是細線
                const yLo      = -Math.max(2, em * 0.08);  // 線相對文字下緣的容許範圍
                const yHi      = em * 0.45;
                const maxRatio = 3.0;                      // 線不可遠比文字寬（排除表格框線）
                const padAbs   = em * 1.2;
                const minCover = 0.6;                      // 線要覆蓋文字寬度的六成以上

                const segs = findUnderlineSegments(canvas, minLen, maxThick);
                if (segs.length === 0) return;

                spans.forEach(span => {
                    // 內容不像答案（不是純數字）就直接跳過，不做底線判斷
                    if (!ANSWER_LIKE.test(span.textContent)) return;

                    const r = span.getBoundingClientRect();
                    const x1 = (r.left - cRect.left) * sx;
                    const x2 = (r.right - cRect.left) * sx;
                    const bottom = (r.bottom - cRect.top) * sy;
                    const w = x2 - x1;
                    if (w <= 0) return;

                    const hit = segs.find(L => {
                        if (L.y < bottom + yLo || L.y > bottom + yHi) return false;
                        const len = L.x2 - L.x1;
                        if (len > Math.max(w * maxRatio, w + padAbs)) return false;
                        const ov = Math.min(L.x2, x2) - Math.max(L.x1, x1);
                        return ov > w * minCover;
                    });

                    if (hit) {
                        span.dataset.answerBlank = '1';
                        // 畫出黃色標示，讓老師看得到哪些字會被跳過
                        const mark = document.createElement('div');
                        mark.className = 'answer-blank-mark';
                        mark.style.left   = (x1 / sx) + 'px';
                        mark.style.top    = ((r.top - cRect.top)) + 'px';
                        mark.style.width  = (w / sx) + 'px';
                        mark.style.height = r.height + 'px';
                        interactionLayer.appendChild(mark);
                    }
                });
            } catch (err) {
                // 偵測失敗時不應影響正常報讀功能
                console.warn('底線答案偵測失敗，已略過：', err);
            }
        }

        // ---------- 開關 ----------
        function setSkipAnswerMode(on) {
            skipAnswerMode = !!on;
            document.body.classList.toggle('skip-answer-mode', skipAnswerMode);
            if (skipAnswerBtn) skipAnswerBtn.classList.toggle('skip-btn-on', skipAnswerMode);
            stopSpeaking(true); // 切換後先停止，避免沿用舊的文字內容
            if (typeof schedulePreview === 'function') schedulePreview(0); // 更新手動框預覽
        }

        if (skipAnswerBtn) {
            skipAnswerBtn.addEventListener('click', () => setSkipAnswerMode(!skipAnswerMode));
        }
        // ============ 【跳過底線答案】程式碼結束 ==========================

        // ==================================================================
        // ============== 【新增功能：手動報讀框】 ===========================
        // 用途：考卷上若有「紅框沒有標記到」的文字，可開啟這個可移動、可縮放
        //       的框，把它蓋在要報讀的文字上，再按「朗讀框內文字」。
        // 設計重點：
        //   1. 框體 pointer-events:none，所以不會擋住下方原有紅框的點擊。
        //      只有「四邊（移動）」與「四角（縮放）」會接收滑鼠事件。
        //   2. 文字擷取直接沿用原本已驗證過的 extractTextFromBoxCoords()，
        //      用 duck typing 餵給它一個 rect 與 span 清單，確保分行/分欄
        //      排序行為與紅框完全一致（含直書/橫書切換）。
        // ==================================================================
        const manualFrame   = document.getElementById('manual-reader-frame');
        const manualPanel   = document.getElementById('manual-reader-panel');
        const manualModeBtn = document.getElementById('manual-mode-btn');
        const mrpHead       = document.getElementById('mrp-head');
        const mrfPreview    = document.getElementById('mrf-preview');
        const mrfCount      = document.getElementById('mrf-count');
        const mrfSpeakBtn   = document.getElementById('mrf-speak-btn');
        const mrfResetBtn   = document.getElementById('mrf-reset-btn');
        const mrfCloseBtn   = document.getElementById('mrf-close-btn');
        const pdfContainer  = document.getElementById('view-pdf-container');

        const MRF_MIN_W = 40;      // 框最小寬
        const MRF_MIN_H = 28;      // 框最小高
        const MRF_TOP_LIMIT = 100; // 框不可高於此 Y（避免壓到上方 toolbar 與標籤）
        const MRF_EMPTY_HINT = '把框移到要報讀的文字上面';

        let manualModeOn = false;
        let mrfInited = false;
        let previewTimer = null;

        // ---------- 開關手動模式 ----------
        function setManualMode(on) {
            if (!manualFrame) return; // 防禦：元素不存在時不做任何事
            manualModeOn = !!on;
            document.body.classList.toggle('manual-mode', manualModeOn);

            if (manualModeOn) {
                if (!mrfInited) { resetManualFrame(); mrfInited = true; }
                manualModeBtn.classList.add('mrf-btn-on');
                schedulePreview(0);
            } else {
                manualModeBtn.classList.remove('mrf-btn-on');
                // 若正在用手動框報讀，關閉時一併停止
                if (activeBox === manualFrame) stopSpeaking(true);
            }
        }

        // ---------- 把框放回畫面中央 ----------
        function resetManualFrame() {
            const vw = window.innerWidth  || 1024; // 取不到尺寸時用保守預設值
            const vh = window.innerHeight || 768;
            const w = Math.min(640, Math.max(220, vw * 0.5));
            manualFrame.style.width  = Math.round(w) + 'px';
            manualFrame.style.height = '110px';
            manualFrame.style.left   = Math.round((vw - w) / 2) + 'px';
            manualFrame.style.top    = Math.max(MRF_TOP_LIMIT, Math.round(vh * 0.32)) + 'px';
            clampManualFrame();
            schedulePreview(0);
        }

        // ---------- 限制框不要跑出畫面 ----------
        function clampManualFrame() {
            // 視窗最小化或尚未取得尺寸時，innerWidth/innerHeight 會是 0。
            // 此時若照常計算，框會被壓縮成最小尺寸，還原視窗後就不見了，所以直接跳過。
            if (!window.innerWidth || !window.innerHeight) return;

            let left = parseFloat(manualFrame.style.left)   || 0;
            let top  = parseFloat(manualFrame.style.top)    || 0;
            let w    = parseFloat(manualFrame.style.width)  || MRF_MIN_W;
            let h    = parseFloat(manualFrame.style.height) || MRF_MIN_H;

            w = Math.max(MRF_MIN_W, Math.min(w, window.innerWidth));
            h = Math.max(MRF_MIN_H, Math.min(h, Math.max(MRF_MIN_H, window.innerHeight - MRF_TOP_LIMIT)));
            left = Math.max(0, Math.min(left, window.innerWidth - w));
            top  = Math.max(MRF_TOP_LIMIT, Math.min(top, window.innerHeight - h));

            manualFrame.style.left   = left + 'px';
            manualFrame.style.top    = top + 'px';
            manualFrame.style.width  = w + 'px';
            manualFrame.style.height = h + 'px';
        }

        // ---------- 拖曳移動 / 四角縮放 ----------
        // mode: 'move' | 'nw' | 'ne' | 'sw' | 'se'
        function startFrameDrag(e, mode) {
            if (e.button !== undefined && e.button !== 0) return; // 只接受左鍵
            e.preventDefault();
            e.stopPropagation();

            const startX = e.clientX, startY = e.clientY;
            const r = manualFrame.getBoundingClientRect();
            const o = { left: r.left, top: r.top, w: r.width, h: r.height };
            const target = e.currentTarget;
            try { target.setPointerCapture(e.pointerId); } catch (err) {}

            function onMove(ev) {
                const dx = ev.clientX - startX;
                const dy = ev.clientY - startY;
                let left = o.left, top = o.top, w = o.w, h = o.h;

                if (mode === 'move') {
                    left = o.left + dx;
                    top  = o.top + dy;
                } else {
                    if (mode.indexOf('e') !== -1) { w = o.w + dx; }
                    if (mode.indexOf('s') !== -1) { h = o.h + dy; }
                    if (mode.indexOf('w') !== -1) { w = o.w - dx; left = o.left + dx; }
                    if (mode.indexOf('n') !== -1) { h = o.h - dy; top  = o.top + dy; }
                    // 縮到最小時，避免反向拖曳把框翻面
                    if (w < MRF_MIN_W) {
                        if (mode.indexOf('w') !== -1) left = o.left + (o.w - MRF_MIN_W);
                        w = MRF_MIN_W;
                    }
                    if (h < MRF_MIN_H) {
                        if (mode.indexOf('n') !== -1) top = o.top + (o.h - MRF_MIN_H);
                        h = MRF_MIN_H;
                    }
                }

                manualFrame.style.left   = left + 'px';
                manualFrame.style.top    = top + 'px';
                manualFrame.style.width  = w + 'px';
                manualFrame.style.height = h + 'px';
                clampManualFrame();
                schedulePreview();
            }

            function onUp(ev) {
                target.removeEventListener('pointermove', onMove);
                target.removeEventListener('pointerup', onUp);
                target.removeEventListener('pointercancel', onUp);
                try { target.releasePointerCapture(ev.pointerId); } catch (err) {}
                schedulePreview(0);
            }

            target.addEventListener('pointermove', onMove);
            target.addEventListener('pointerup', onUp);
            target.addEventListener('pointercancel', onUp);
        }

        if (manualFrame) {
            manualFrame.querySelectorAll('.mrf-edge').forEach(el => {
                el.addEventListener('pointerdown', (e) => startFrameDrag(e, 'move'));
            });
            manualFrame.querySelectorAll('.mrf-handle').forEach(el => {
                el.addEventListener('pointerdown', (e) => startFrameDrag(e, el.dataset.dir));
            });
        }

        // ---------- 控制面板本身也可以拖開，避免擋住考卷 ----------
        if (mrpHead) {
            mrpHead.addEventListener('pointerdown', (e) => {
                if (e.target.closest('button')) return; // 按關閉鈕時不要觸發拖曳
                e.preventDefault();
                const startX = e.clientX, startY = e.clientY;
                const r = manualPanel.getBoundingClientRect();
                // 從 right/bottom 定位切換為 left/top 定位，才能自由拖曳
                manualPanel.style.right  = 'auto';
                manualPanel.style.bottom = 'auto';
                manualPanel.style.left   = r.left + 'px';
                manualPanel.style.top    = r.top + 'px';

                const o = { left: r.left, top: r.top, w: r.width, h: r.height };
                const target = e.currentTarget;
                try { target.setPointerCapture(e.pointerId); } catch (err) {}

                function onMove(ev) {
                    let left = o.left + (ev.clientX - startX);
                    let top  = o.top + (ev.clientY - startY);
                    left = Math.max(0, Math.min(left, window.innerWidth - o.w));
                    top  = Math.max(68, Math.min(top, window.innerHeight - 44));
                    manualPanel.style.left = left + 'px';
                    manualPanel.style.top  = top + 'px';
                }
                function onUp(ev) {
                    target.removeEventListener('pointermove', onMove);
                    target.removeEventListener('pointerup', onUp);
                    target.removeEventListener('pointercancel', onUp);
                    try { target.releasePointerCapture(ev.pointerId); } catch (err) {}
                }
                target.addEventListener('pointermove', onMove);
                target.addEventListener('pointerup', onUp);
                target.addEventListener('pointercancel', onUp);
            });
        }

        // ---------- 擷取框內文字（沿用原本紅框的排序演算法）----------
        function getManualFrameText() {
            if (!manualFrame || !manualModeOn) return '';
            const rect = manualFrame.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return '';

            // 收集所有與框重疊的頁面文字層 spans（框可能橫跨兩頁）
            const spans = [];
            document.querySelectorAll('#pdf-pages-wrapper .textLayer').forEach(layer => {
                const lr = layer.getBoundingClientRect();
                if (lr.right < rect.left || lr.left > rect.right ||
                    lr.bottom < rect.top || lr.top > rect.bottom) return;
                spans.push(...layer.querySelectorAll('span'));
            });
            if (spans.length === 0) return '';

            // duck typing：餵給原本的函式，確保排序規則與紅框 100% 一致
            return extractTextFromBoxCoords(
                { getBoundingClientRect: () => rect },
                { querySelectorAll: () => spans }
            );
        }

        // ---------- 更新面板預覽（防彈跳，避免拖曳時卡頓）----------
        function schedulePreview(delay) {
            if (delay === undefined) delay = 150;
            clearTimeout(previewTimer);
            previewTimer = setTimeout(updateManualPreview, delay);
        }

        function updateManualPreview() {
            if (!manualModeOn || !mrfPreview) return;
            const text = getManualFrameText().trim();
            if (text) {
                mrfPreview.textContent = text;
                mrfPreview.classList.remove('mrf-empty');
                mrfCount.textContent = text.length + ' 字';
                mrfSpeakBtn.disabled = false;
            } else {
                mrfPreview.textContent = MRF_EMPTY_HINT;
                mrfPreview.classList.add('mrf-empty');
                mrfCount.textContent = '0 字';
                mrfSpeakBtn.disabled = true;
            }
        }

        // ---------- 朗讀框內文字 ----------
        function speakManualFrame() {
            const text = getManualFrameText();
            if (!text.trim()) return;
            stopSpeaking(true);                 // 先完全停掉舊的報讀
            speakText(text, manualFrame);       // 沿用原本的分段報讀引擎
        }

        // ---------- 事件綁定 ----------
        if (manualModeBtn) manualModeBtn.addEventListener('click', () => setManualMode(!manualModeOn));
        if (mrfSpeakBtn)   mrfSpeakBtn.addEventListener('click', speakManualFrame);
        if (mrfResetBtn)   mrfResetBtn.addEventListener('click', resetManualFrame);
        if (mrfCloseBtn)   mrfCloseBtn.addEventListener('click', () => setManualMode(false));

        // 捲動考卷 / 改變視窗 / 切換直橫書 時，重新計算框內文字
        if (pdfContainer) pdfContainer.addEventListener('scroll', () => schedulePreview(200));
        window.addEventListener('resize', () => {
            if (!manualModeOn) return;
            clampManualFrame();
            schedulePreview();
        });
        document.getElementById('reading-direction').addEventListener('change', () => schedulePreview(0));

        // ---------- 鍵盤微調：方向鍵移動、Shift+方向鍵改大小、Enter 朗讀 ----------
        document.addEventListener('keydown', (e) => {
            if (!manualModeOn || body.dataset.mode !== 'page2') return;
            const t = e.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;

            if (e.key === 'Enter') {
                e.preventDefault();
                speakManualFrame();
                return;
            }

            const step = e.altKey ? 1 : 10; // 按住 Alt 可做 1px 精細微調
            const r = manualFrame.getBoundingClientRect();
            let left = r.left, top = r.top, w = r.width, h = r.height;
            let handled = true;

            if (e.shiftKey) {
                if      (e.key === 'ArrowRight') w += step;
                else if (e.key === 'ArrowLeft')  w -= step;
                else if (e.key === 'ArrowDown')  h += step;
                else if (e.key === 'ArrowUp')    h -= step;
                else handled = false;
            } else {
                if      (e.key === 'ArrowRight') left += step;
                else if (e.key === 'ArrowLeft')  left -= step;
                else if (e.key === 'ArrowDown')  top  += step;
                else if (e.key === 'ArrowUp')    top  -= step;
                else handled = false;
            }
            if (!handled) return;

            e.preventDefault();
            manualFrame.style.left   = left + 'px';
            manualFrame.style.top    = top + 'px';
            manualFrame.style.width  = Math.max(MRF_MIN_W, w) + 'px';
            manualFrame.style.height = Math.max(MRF_MIN_H, h) + 'px';
            clampManualFrame();
            schedulePreview(0);
        });
        // ================ 【手動報讀框】程式碼結束 ========================

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }
        populateVoices();
    </script>
</body>
</html>
